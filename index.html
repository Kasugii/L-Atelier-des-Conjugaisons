<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉVEIL : Astralis — Révise ton EDM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#fff5fa;
    --bg1:#ffeaf4;
    --bg2:#f3e9ff;
    --panel:rgba(255,255,255,.82);
    --panel-solid:#ffffff;
    --stroke:rgba(220,150,200,.35);
    --stroke-hi:rgba(255,126,182,.6);
    --cyan:#7fd8be;        /* menthe douce */
    --violet:#b88be8;      /* lavande */
    --or:#f4b740;          /* or rosé */
    --rose:#ff7eb6;        /* rose bonbon */
    --txt:#5a3a52;         /* prune doux */
    --txt-dim:#a98aa0;
    --ok:#3fb98a;
    --ko:#ff6f91;
    --r:20px;
    --display:'Baloo 2',system-ui,sans-serif;
    --body:'Outfit',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--body);color:var(--txt);
    background:var(--bg0);
    min-height:100vh;padding:0 0 90px;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .sky{position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(1100px 650px at 80% -8%, rgba(255,182,217,.55), transparent 60%),
      radial-gradient(900px 600px at 10% 6%, rgba(184,139,232,.30), transparent 55%),
      radial-gradient(700px 500px at 50% 110%, rgba(127,216,190,.25), transparent 60%),
      linear-gradient(160deg,var(--bg0),var(--bg1) 55%,var(--bg2));
  }
  .stars{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.85}
  .stars i{position:absolute;width:7px;height:7px;color:#ff9ecb;font-size:9px;line-height:1;
    animation:tw 3.5s ease-in-out infinite}
  .stars i::before{content:"✦"}
  @keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.95;transform:scale(1.2)}}

  .wrap{max-width:840px;margin:0 auto;padding:16px 16px 0;position:relative;z-index:1}

  header{margin-top:8px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,40px);line-height:.95;
    background:linear-gradient(100deg,var(--cyan),var(--violet) 55%,var(--or));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 12px rgba(255,126,182,.4));letter-spacing:.5px}
  .logo small{display:block;font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:3px;
    color:var(--txt-dim);-webkit-text-fill-color:var(--txt-dim);text-transform:uppercase;margin-top:2px}
  .badgeStar{font-size:30px;filter:drop-shadow(0 0 9px var(--rose));animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}

  .hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;
    background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:10px 12px;
    backdrop-filter:blur(8px)}
  .hud .lab{font-size:12px;color:var(--txt-dim);font-weight:600}
  .hud input{font:inherit;font-weight:700;color:var(--txt);background:rgba(255,235,246,.7);
    border:1px solid var(--stroke);border-radius:11px;padding:7px 11px;width:150px;outline:none}
  .hud input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(95,227,255,.18)}
  .scorechip{display:flex;align-items:center;gap:6px;margin-left:auto;
    background:linear-gradient(95deg,rgba(244,183,64,.22),rgba(184,139,232,.22));
    border:1px solid rgba(240,201,107,.5);border-radius:999px;padding:6px 14px;font-weight:800}
  .scorechip b{font-variant-numeric:tabular-nums;font-size:17px;color:var(--or)}
  .netchip{font-size:11px;font-weight:800;letter-spacing:.5px;padding:5px 11px;border-radius:999px;text-transform:uppercase}
  .netchip.on{background:rgba(86,227,159,.18);color:var(--ok);border:1px solid rgba(86,227,159,.5)}
  .netchip.off{background:rgba(255,107,122,.14);color:var(--ko);border:1px solid rgba(255,107,122,.4)}

  nav.tabs{display:flex;gap:8px;margin:16px 0 2px;flex-wrap:wrap}
  nav.tabs button{font:inherit;font-weight:700;font-size:14px;color:var(--txt-dim);
    background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:9px 15px;cursor:pointer;
    backdrop-filter:blur(6px);transition:.18s;display:flex;align-items:center;gap:6px}
  nav.tabs button:hover{color:var(--txt);border-color:var(--stroke-hi)}
  nav.tabs button.active{color:#fff;
    background:linear-gradient(100deg,var(--cyan),var(--violet));
    border-color:transparent;box-shadow:0 6px 20px rgba(255,126,182,.4);font-weight:800}

  .btn{font:inherit;font-weight:800;font-size:15px;color:var(--txt);cursor:pointer;
    background:var(--panel-solid);border:1px solid var(--stroke-hi);border-radius:14px;padding:12px 18px;
    transition:transform .1s,box-shadow .2s;position:relative}
  .btn:hover{box-shadow:0 0 0 3px rgba(149,200,255,.18)}
  .btn:active{transform:translateY(2px)}
  .btn.primary{color:#fff;border:none;
    background:linear-gradient(100deg,var(--cyan),var(--violet) 60%,var(--or));
    box-shadow:0 8px 22px rgba(255,126,182,.4)}
  .btn.gold{color:#7a4a10;border:none;background:linear-gradient(100deg,var(--or),#ffd98a);box-shadow:0 8px 22px rgba(244,183,64,.45)}
  .btn.ghost{background:transparent;border:1px solid var(--stroke);color:var(--txt-dim)}
  .btn.ghost:hover{color:var(--txt)}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

  .panel{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r);
    padding:18px;margin-top:16px;backdrop-filter:blur(10px);
    box-shadow:0 14px 36px rgba(255,126,182,.18),inset 0 1px 0 rgba(255,255,255,.6)}
  .panel h2{font-family:var(--display);margin:0 0 4px;font-size:24px;font-weight:800}
  .panel .sub{color:var(--txt-dim);margin:0 0 14px;font-size:14px;font-weight:500}
  .eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:4px}
  .back{margin-bottom:12px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin-top:6px}
  .ecard{position:relative;cursor:pointer;border-radius:18px;padding:16px 14px 14px;text-align:left;
    background:linear-gradient(165deg,#ffffff,rgba(255,245,250,.85));
    border:1px solid var(--stroke);overflow:hidden;transition:transform .15s,box-shadow .25s;
    --c:var(--cyan)}
  .ecard::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;
    background:linear-gradient(160deg,var(--c),transparent 60%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.8}
  .ecard::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;
    right:-40px;top:-40px;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.35;filter:blur(6px)}
  .ecard:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(255,126,182,.22),0 0 22px -6px var(--c)}
  .ecard .em{font-size:38px;filter:drop-shadow(0 3px 7px rgba(255,126,182,.35));position:relative}
  .ecard .tt{font-family:var(--display);font-weight:700;font-size:16px;margin-top:8px;line-height:1.1;position:relative}
  .ecard .rar{position:absolute;top:12px;right:12px;font-weight:800;font-size:12px;letter-spacing:1px;
    color:var(--or);text-shadow:0 0 7px rgba(244,183,64,.5)}
  .ecard .meta{font-size:11px;color:var(--txt-dim);font-weight:600;margin-top:8px;position:relative}
  .ecard .bar{height:6px;border-radius:999px;background:rgba(255,235,246,.7);margin-top:8px;overflow:hidden;position:relative}
  .ecard .bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 8px var(--c)}

  .lesson-part{margin:0 0 14px;padding:14px 16px;border-radius:14px;position:relative;
    background:linear-gradient(120deg,#ffffff,rgba(255,240,248,.55));
    border:1px solid var(--stroke);border-left:4px solid var(--c,var(--cyan))}
  .lesson-part h3{font-family:var(--display);margin:0 0 8px;font-size:17px;color:var(--cyan)}
  .lesson-part p{margin:6px 0;line-height:1.55;color:var(--txt)}
  .lesson-part b{color:var(--or);font-weight:700}

  .qhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--txt-dim);font-size:13px;margin-bottom:8px}
  .qhead .combo{color:var(--or);font-variant-numeric:tabular-nums}
  .path{height:10px;border-radius:999px;background:rgba(255,235,246,.7);overflow:hidden;margin:2px 0 18px;border:1px solid var(--stroke)}
  .path i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--or));
    box-shadow:0 0 12px rgba(255,126,182,.55);transition:width .35s ease}
  .qtext{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 16px;line-height:1.32}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{font:inherit;text-align:left;font-weight:600;font-size:15px;color:var(--txt);cursor:pointer;
    background:linear-gradient(120deg,#ffffff,rgba(255,240,248,.7));
    border:1px solid var(--stroke);border-radius:14px;padding:13px 16px;transition:.14s;position:relative}
  .choice:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 0 3px rgba(95,227,255,.14);transform:translateX(3px)}
  .choice.good{background:linear-gradient(120deg,rgba(86,227,159,.25),rgba(86,227,159,.05));border-color:var(--ok);color:#bff7da}
  .choice.bad{background:linear-gradient(120deg,rgba(255,107,122,.22),rgba(255,107,122,.05));border-color:var(--ko);color:#ffcfd4}
  .choice:disabled{cursor:default}
  .txtans{display:flex;gap:10px}
  .txtans input{flex:1;font:inherit;font-weight:600;color:var(--txt);background:rgba(255,235,246,.7);
    border:1px solid var(--stroke);border-radius:14px;padding:13px 16px;outline:none}
  .txtans input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(95,227,255,.16)}
  .feedback{margin-top:16px;padding:13px 16px;border-radius:14px;font-weight:700;line-height:1.45;display:none}
  .feedback.show{display:block;animation:rise .3s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .feedback.good{background:rgba(86,227,159,.12);color:#bff7da;border:1px solid rgba(86,227,159,.45)}
  .feedback.bad{background:rgba(255,107,122,.12);color:#ffcfd4;border:1px solid rgba(255,107,122,.4)}
  .feedback .pq{font-weight:500;color:var(--txt);margin-top:5px;display:block}

  .result{text-align:center;padding:8px 0}
  .result .ring{font-family:var(--display);font-size:clamp(44px,12vw,68px);font-weight:800;
    background:linear-gradient(100deg,var(--cyan),var(--violet),var(--or));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 16px rgba(255,126,182,.4));line-height:1}
  .result .grade{font-family:var(--display);font-size:20px;font-weight:700;margin:8px 0}
  .result .gained{display:inline-block;margin:6px 0 14px;padding:6px 16px;border-radius:999px;font-weight:800;
    background:linear-gradient(95deg,rgba(244,183,64,.22),rgba(184,139,232,.22));border:1px solid rgba(240,201,107,.5);color:var(--or)}

  .lb-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;margin-bottom:9px;
    background:linear-gradient(120deg,#ffffff,rgba(255,240,248,.7));border:1px solid var(--stroke);font-weight:600}
  .lb-row.me-row{border-color:var(--or);background:linear-gradient(120deg,rgba(240,201,107,.16),rgba(240,201,107,.02));box-shadow:0 0 20px -6px var(--or)}
  .lb-row .rk{width:34px;text-align:center;font-family:var(--display);font-weight:800;font-size:18px}
  .lb-row .nm{flex:1;display:flex;align-items:center;gap:7px}
  .lb-row .sc{font-weight:800;font-variant-numeric:tabular-nums;color:var(--cyan);font-size:16px}
  .tag{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:999px;text-transform:uppercase}
  .tag.bot{background:rgba(164,114,255,.18);color:#c7adff;border:1px solid rgba(164,114,255,.4)}
  .tag.live{background:rgba(86,227,159,.18);color:#8df0c0;border:1px solid rgba(86,227,159,.45)}

  .duel-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:12px 0 18px}
  .duel-col{border-radius:16px;padding:14px 10px;text-align:center;
    background:linear-gradient(165deg,#ffffff,rgba(255,245,250,.85));border:1px solid var(--stroke)}
  .duel-col.mine{border-color:var(--cyan);box-shadow:0 0 22px -8px var(--cyan)}
  .duel-col.opp{border-color:var(--rose);box-shadow:0 0 22px -8px var(--rose)}
  .duel-col .nm{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:4px}
  .duel-col .sc{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
  .duel-col.mine .sc{color:var(--cyan)}.duel-col.opp .sc{color:var(--rose)}
  .duel-col .st{font-size:11px;color:var(--txt-dim);font-weight:600;min-height:15px;margin-top:2px}
  .vs{font-family:var(--display);font-weight:800;font-size:22px;color:var(--or);
    text-shadow:0 0 12px rgba(244,183,64,.5)}
  .code-box{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:10px;text-align:center;
    background:linear-gradient(100deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;
    border:1px dashed var(--stroke-hi);border-radius:16px;padding:18px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row input{flex:1;min-width:130px;font:inherit;font-weight:800;text-transform:uppercase;color:var(--txt);
    background:rgba(255,235,246,.7);border:1px solid var(--stroke);border-radius:14px;padding:13px 16px;text-align:center;letter-spacing:5px;outline:none}
  .row input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(95,227,255,.16)}
  .hint{font-size:13px;color:var(--txt-dim);font-weight:500;line-height:1.6}
  .hint code{background:rgba(255,235,246,.7);border:1px solid var(--stroke);border-radius:6px;padding:1px 6px;color:var(--cyan);font-size:12px}
  hr.sep{border:none;border-top:1px solid var(--stroke);margin:18px 0}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--panel-solid);color:var(--txt);font-weight:700;padding:12px 20px;border-radius:14px;z-index:50;
    border:1px solid var(--stroke-hi);box-shadow:0 10px 28px rgba(184,139,232,.4);display:none}
  .toast.show{display:block;animation:rise .3s}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);gap:11px}
  }
</style>
</head>
<body>
<div class="sky"></div>
<div class="stars" id="stars"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="badgeStar">🌌</span>
      <div class="logo">ÉVEIL : Astralis<small>Examen d'Étude du milieu · 3e primaire</small></div>
    </div>
    <div class="hud">
      <span class="lab">Pilote :</span>
      <input id="pseudo" maxlength="16" placeholder="Ton prénom">
      <span class="netchip off" id="netstate">hors ligne</span>
      <span class="scorechip">⭐ <b id="myscore">0</b></span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="apprendre" class="active">📖 Codex</button>
    <button data-tab="jouer">⚡ Missions</button>
    <button data-tab="duel">⚔️ Duel</button>
    <button data-tab="classement">🏆 Classement</button>
  </nav>

  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* === DONNÉES === */
/* ============================================================
   L'ÉTUDE DU MILIEU — contenu d'examen 3e primaire (Belgique)
   Chaque thème : { id, titre, emoji, couleur, lecon[], questions[] }
   Type de question :
     qcm   : {q, choix[], bon (index), pourquoi}
     vf    : {q, bon (true/false), pourquoi}
     texte : {q, reponses[] (acceptées, minuscules), pourquoi}
   ============================================================ */
const THEMES = [

/* ---------- 1. LIGNE DU TEMPS ---------- */
{
  id:"temps", titre:"La ligne du temps", emoji:"⏳", couleur:"#c0612e",
  lecon:[
    {t:"Le siècle et la décennie", p:[
      "Un <b>siècle</b> dure <b>100 ans</b>. Une <b>décennie</b> dure <b>10 ans</b>.",
      "Nous sommes au <b>21e siècle</b>. Il a commencé en <b>2001</b>.",
      "Le <b>20e siècle</b> allait de <b>1901 à 2000</b>."
    ]},
    {t:"Lire une ligne du temps", p:[
      "On range les évènements du plus <b>ancien</b> (à gauche) au plus <b>récent</b> (à droite).",
      "Pour situer une année, on cherche d'abord sa <b>décennie</b> (ex : 2013 → décennie 2010), puis l'année exacte.",
      "Le mot <b>avant</b> = plus à gauche = plus ancien. Le mot <b>après</b> = plus à droite = plus récent."
    ]},
    {t:"Quelques repères à connaître", p:[
      "1914–1918 : la <b>Première Guerre mondiale</b>.",
      "1939–1945 : la <b>Deuxième Guerre mondiale</b>.",
      "2013 : le roi <b>Philippe</b> prête serment.",
      "Le Titanic coule en <b>1912</b>. L'Atomium est inauguré en <b>1958</b>."
    ]}
  ],
  questions:[
    {type:"texte", q:"Combien d'années dure un siècle ?", reponses:["100","100 ans","cent"], pourquoi:"Un siècle = 100 ans."},
    {type:"texte", q:"Combien d'années dure une décennie ?", reponses:["10","10 ans","dix"], pourquoi:"Une décennie = 10 ans."},
    {type:"qcm", q:"En quelle année a commencé le 21e siècle ?", choix:["1900","2000","2001","2010"], bon:2, pourquoi:"Le 21e siècle a commencé en 2001."},
    {type:"qcm", q:"Le 20e siècle allait de…", choix:["1900 à 1999","1901 à 2000","2000 à 2100","1801 à 1900"], bon:1, pourquoi:"De 1901 à 2000."},
    {type:"qcm", q:"L'année 2013 se trouve dans quelle décennie ?", choix:["2000","2010","2020","1990"], bon:1, pourquoi:"2013 est dans la décennie 2010 (de 2010 à 2019)."},
    {type:"qcm", q:"L'année 1923 se trouve dans quelle décennie ?", choix:["1900","1910","1920","1930"], bon:2, pourquoi:"1923 est dans la décennie 1920."},
    {type:"qcm", q:"Quel évènement est le plus ancien ?", choix:["L'Atomium (1958)","Le Titanic coule (1912)","Le roi Philippe (2013)"], bon:1, pourquoi:"1912 vient avant 1958 et 2013."},
    {type:"qcm", q:"Quel évènement est le plus récent ?", choix:["Le Titanic (1912)","La 1ère Guerre mondiale (1914)","Le roi Philippe (2013)"], bon:2, pourquoi:"2013 est l'année la plus récente."},
    {type:"vf", q:"Une décennie dure plus longtemps qu'un siècle.", bon:false, pourquoi:"Non : 10 ans < 100 ans."},
    {type:"qcm", q:"Sur une ligne du temps, où place-t-on l'évènement le plus ancien ?", choix:["À gauche","À droite","Au milieu"], bon:0, pourquoi:"Le plus ancien est à gauche."},
    {type:"qcm", q:"En quelle année coule le Titanic ?", choix:["1908","1912","1920","1899"], bon:1, pourquoi:"Le Titanic coule en 1912."},
    {type:"qcm", q:"En quelle année est inauguré l'Atomium ?", choix:["1948","1958","1968","1938"], bon:1, pourquoi:"L'Atomium est inauguré en 1958."}
  ]
},

/* ---------- 2. PREMIÈRE GUERRE MONDIALE ---------- */
{
  id:"guerre", titre:"La 1ère Guerre mondiale", emoji:"🎖️", couleur:"#6b6f45",
  lecon:[
    {t:"Quand et combien de temps ?", p:[
      "La Première Guerre mondiale a duré de <b>1914 à 1918</b>, soit <b>4 ans</b>.",
      "L'Allemagne est entrée en guerre contre la France au mois d'<b>août</b> 1914.",
      "Elle ne s'est pas déroulée qu'en Belgique : beaucoup de pays y ont participé."
    ]},
    {t:"La Belgique dans la guerre", p:[
      "La Belgique était <b>neutre</b> : cela veut dire qu'elle ne voulait participer à <b>aucune guerre</b>.",
      "Les Allemands ont quand même envahi la Belgique.",
      "Les soldats se cachaient dans des <b>tranchées</b> (des fossés creusés dans le sol)."
    ]},
    {t:"Les poilus et la fin", p:[

    {type:"qcm", q:"D'où vient surtout l'eau qu'on consomme ?", choix:["des nappes souterraines","de la pluie directe","de la mer"], bon:0, pourquoi:"Surtout des nappes souterraines (et lacs, rivières)."},
    {type:"qcm", q:"Où l'eau est-elle nettoyée pour devenir potable ?", choix:["L'usine de traitement","La station d'épuration","Le château d'eau"], bon:0, pourquoi:"À l'usine de traitement (potabilisation)."},
    {type:"texte", q:"Comment appelle-t-on l'eau qu'on peut boire ? (l'eau p______)", reponses:["potable","l'eau potable","eau potable"], pourquoi:"C'est l'eau potable."},
    {type:"qcm", q:"Où l'eau potable est-elle stockée avant d'aller dans les maisons ?", choix:["La station d'épuration","Le château d'eau","Les égouts"], bon:1, pourquoi:"Dans le château d'eau."},
    {type:"qcm", q:"Pourquoi le château d'eau est-il si haut ?", choix:["Pour être joli","Pour donner de la pression","Pour voir loin"], bon:1, pourquoi:"Pour donner de la pression dans les robinets."},
    {type:"qcm", q:"Où partent les eaux usées (sales) ?", choix:["La station d'épuration","Le château d'eau","L'usine de traitement"], bon:0, pourquoi:"Vers la station d'épuration par les égouts."},
    {type:"vf", q:"En sortant de la station d'épuration, l'eau est potable.", bon:false, pourquoi:"Faux : elle est propre mais pas potable. Elle repart dans la nature."},
    {type:"vf", q:"On peut boire l'eau de la rivière.", bon:false, pourquoi:"Faux : elle n'est pas potable."},
    {type:"vf", q:"Les eaux usées partent vers la station d'épuration.", bon:true, pourquoi:"Vrai."},
    {type:"qcm", q:"Quel est un bon geste pour économiser l'eau ?", choix:["Laisser couler le robinet","Fermer le robinet en se brossant les dents","Prendre un grand bain qui déborde"], bon:1, pourquoi:"Fermer le robinet économise l'eau."},
    {type:"qcm", q:"Une fois nettoyée à la station d'épuration, où repart l'eau ?", choix:["Dans la nature","Dans le château d'eau","Dans les robinets"], bon:0, pourquoi:"Elle repart dans la nature."}
  ]
}

];

</script>
<script>
/* === LOGIQUE === */
/* ============================================================
   L'ÉVEIL MALIN — logique
   ============================================================ */

/* ---- CONFIG : adresse du serveur Render (à remplacer) ---- */
const SERVER_URL = "wss://l-atelier-des-conjugaisons.onrender.com"; // ← mets ici l'URL Render (wss://...)

/* ---- état local ---- */
const store = {
  pseudo: localStorage.getItem("edm_pseudo") || "",
  score: +(localStorage.getItem("edm_score") || 0),
  done: JSON.parse(localStorage.getItem("edm_done") || "{}") // {themeId:{seen:n}}
};
function save(){
  localStorage.setItem("edm_pseudo", store.pseudo);
  localStorage.setItem("edm_score", store.score);
  localStorage.setItem("edm_done", JSON.stringify(store.done));
}

const $ = s => document.querySelector(s);
const view = $("#view");
const norm = s => (s||"").toLowerCase().trim()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,!?']/g,"").replace(/\s+/g," ");

/* ---- toast ---- */
let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600);
}

/* ---- score ---- */
function addScore(n){
  store.score += n; save();
  $("#myscore").textContent = store.score;
  net.pushScore();
}

/* =====================================================
   ONGLETS
   ===================================================== */
let currentTab = "apprendre";
$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  currentTab = b.dataset.tab;
  [...$("#tabs").children].forEach(x=>x.classList.toggle("active", x===b));
  render();
});

function render(){
  if(currentTab==="apprendre") screenThemes("apprendre");
  else if(currentTab==="jouer") screenThemes("jouer");
  else if(currentTab==="duel") screenDuel();
  else if(currentTab==="classement") screenBoard();
}

/* =====================================================
   ÉCRAN : liste des thèmes (apprendre OU jouer)
   ===================================================== */
function rarityStars(t){ // 4 ou 5 étoiles façon gacha selon la richesse du sujet
  return (t.questions.length>=12) ? "★★★★★" : "★★★★";
}
function screenThemes(mode){
  const eyebrow = mode==="apprendre" ? "Base de données" : "Sélection de mission";
  const title   = mode==="apprendre" ? "📖 Codex stellaire" : "⚡ Choisis ta mission";
  const intro   = mode==="apprendre"
    ? "Ouvre une entrée du Codex pour étudier la leçon avant l'examen."
    : "Lance une mission, enchaîne les bonnes réponses et grimpe au classement.";
  let html = `<div class="panel"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>
    <p class="sub">${intro}</p><div class="grid">`;
  THEMES.forEach(t=>{
    const total = t.questions.length;
    const seen = store.done[t.id]?.best || 0;
    const pc = total ? Math.round(seen/total*100) : 0;
    html += `<button class="ecard" data-id="${t.id}" data-mode="${mode}" style="--c:${t.couleur}">
      <div class="rar">${rarityStars(t)}</div>
      <div class="em">${t.emoji}</div>
      <div class="tt">${t.titre}</div>
      ${mode==="jouer"
        ? `<div class="bar"><i style="width:${pc}%"></i></div><div class="meta">Record · ${seen}/${total}</div>`
        : `<div class="meta">${t.lecon.length} chapitres · ${total} questions</div>`}
    </button>`;
  });
  html += `</div></div>`;
  view.innerHTML = html;
  view.querySelectorAll(".ecard").forEach(c=>{
    c.onclick = ()=> c.dataset.mode==="apprendre"
      ? screenLesson(c.dataset.id) : startQuiz(c.dataset.id);
  });
}

/* =====================================================
   ÉCRAN : leçon
   ===================================================== */
function screenLesson(id){
  const t = THEMES.find(x=>x.id===id);
  let html = `<button class="btn ghost sm back" id="bk">← Retour</button>
    <div class="panel" style="--c:${t.couleur}"><div class="eyebrow">Codex · ${rarityStars(t)}</div>
    <h2>${t.emoji} ${t.titre}</h2><p class="sub">Étudie chaque chapitre, puis pars en mission.</p>`;
  t.lecon.forEach(part=>{
    html += `<div class="lesson-part"><h3>${part.t}</h3>`;
    part.p.forEach(p=> html += `<p>${p}</p>`);
    html += `</div>`;
  });
  html += `<button class="btn primary" id="go" style="margin-top:6px">⚡ Lancer la mission</button></div>`;
  view.innerHTML = html;
  $("#bk").onclick = ()=>{ currentTab="apprendre"; syncTabs(); render(); };
  $("#go").onclick = ()=> startQuiz(id);
}
function syncTabs(){ [...$("#tabs").children].forEach(x=>x.classList.toggle("active", x.dataset.tab===currentTab)); }

/* =====================================================
   QUIZ solo
   ===================================================== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

let quiz = null;
function startQuiz(id){
  const t = THEMES.find(x=>x.id===id);
  quiz = { theme:t, qs:shuffle(t.questions), i:0, correct:0, combo:0, maxCombo:0 };
  showQuestion();
}
function showQuestion(){
  const {theme,qs,i} = quiz;
  const q = qs[i];
  const prog = Math.round(i/qs.length*100);
  let html = `<button class="btn ghost sm back" id="bk">← Quitter</button>
    <div class="panel" style="--c:${theme.couleur}">
    <div class="qhead"><span>${theme.emoji} ${theme.titre}</span>
      <span class="combo">${quiz.combo>1?("🔥 combo ×"+quiz.combo):("✦ "+quiz.correct+" réussies")}</span></div>
    <div class="path"><i style="width:${prog}%"></i></div>
    <div class="qhead"><span>Question ${i+1} / ${qs.length}</span></div>
    <div class="qtext">${q.q}</div>`;

  if(q.type==="qcm" || q.type==="vf"){
    const opts = q.type==="vf" ? ["Vrai","Faux"] : q.choix;
    const goodIndex = q.type==="vf" ? (q.bon?0:1) : q.bon;
    html += `<div class="choices">`;
    opts.forEach((o,idx)=> html += `<button class="choice" data-i="${idx}">${o}</button>`);
    html += `</div>`;
    html += feedbackBox() + `</div>`;
    view.innerHTML = html;
    bindBack();
    const choices = view.querySelectorAll(".choice");
    choices.forEach(btn=>{
      btn.onclick = ()=>{
        const picked = +btn.dataset.i;
        const ok = picked===goodIndex;
        choices.forEach((c,ci)=>{
          c.disabled = true;
          if(ci===goodIndex) c.classList.add("good");
          else if(ci===picked) c.classList.add("bad");
        });
        afterAnswer(ok, q.pourquoi);
      };
    });
  } else {
    html += `<div class="txtans"><input id="ans" autocomplete="off" placeholder="Écris ta réponse…">
      <button class="btn gold" id="valid">OK</button></div>`;
    html += feedbackBox() + `</div>`;
    view.innerHTML = html;
    bindBack();
    const inp = $("#ans");
    inp.focus();
    const check = ()=>{
      if(inp.disabled) return;
      const ok = q.reponses.some(r=> norm(r)===norm(inp.value));
      inp.disabled = true; $("#valid").disabled = true;
      inp.style.borderColor = ok ? "var(--ok)" : "var(--ko)";
      afterAnswer(ok, q.pourquoi + (ok?"":` (réponse : ${q.reponses[0]})`));
    };
    $("#valid").onclick = check;
    inp.onkeydown = e=>{ if(e.key==="Enter") check(); };
  }
}
function feedbackBox(){
  return `<div class="feedback" id="fb"></div>
    <button class="btn primary" id="next" style="margin-top:14px;display:none">Suivant →</button>`;
}
function bindBack(){ $("#bk").onclick = ()=>{ quiz=null; render(); }; }

function afterAnswer(ok, why){
  if(ok){ quiz.correct++; quiz.combo++; if(quiz.combo>quiz.maxCombo) quiz.maxCombo=quiz.combo; }
  else { quiz.combo=0; }
  const fb = $("#fb");
  fb.className = "feedback show " + (ok?"good":"bad");
  const head = ok ? (quiz.combo>=3?"🔥 Combo ×"+quiz.combo+" !":"✅ Bravo !") : "❌ Presque…";
  fb.innerHTML = head + `<span class="pq">${why}</span>`;
  const next = $("#next");
  next.style.display = "block";
  next.focus();
  next.onclick = ()=>{
    quiz.i++;
    if(quiz.i < quiz.qs.length) showQuestion();
    else finishQuiz();
  };
}

function finishQuiz(){
  const {theme,qs,correct} = quiz;
  const total = qs.length;
  const gained = correct * 10;
  addScore(gained);
  // mémoriser le meilleur
  const rec = store.done[theme.id] || {best:0};
  if(correct > rec.best){ rec.best = correct; }
  store.done[theme.id] = rec; save();

  const pct = correct/total;
  const grade = pct===1 ? "Score parfait ! 🌟" : pct>=.7 ? "Belle mission ! 👏" : pct>=.5 ? "Continue, ça vient 💪" : "À réviser dans le Codex 📖";
  const comboTxt = quiz.maxCombo>=3 ? `<p class="sub">Meilleur combo : <b style="color:var(--or)">×${quiz.maxCombo}</b> 🔥</p>` : "";
  view.innerHTML = `<div class="panel result" style="--c:${theme.couleur}">
    <div class="eyebrow">Rapport de mission</div>
    <h2>${theme.emoji} ${theme.titre}</h2>
    <div class="ring">${correct} / ${total}</div>
    <div class="grade">${grade}</div>
    <div class="gained">+${gained} pts</div>
    ${comboTxt}
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="btn primary" id="again">↻ Rejouer</button>
      <button class="btn ghost" id="lesson">📖 Codex</button>
      <button class="btn ghost" id="home">⚡ Missions</button>
    </div></div>`;
  $("#again").onclick = ()=> startQuiz(theme.id);
  $("#lesson").onclick = ()=>{ currentTab="apprendre"; syncTabs(); screenLesson(theme.id); };
  $("#home").onclick = ()=>{ quiz=null; render(); };
}

/* =====================================================
   BOTS du classement (simulation locale, vivant)
   ===================================================== */
const BOT_NAMES = ["Nova ✦","Orion ✦","Stella ✦","Comète ✦","Lyra ✦","Astro ✦","Vega ✦","Nébula ✦"];
const bots = BOT_NAMES.map(n=>({ pseudo:n, score: 30 + (Math.random()*120|0), bot:true }));
setInterval(()=>{
  // chaque bot gagne parfois des points, comme s'il jouait
  bots.forEach(b=>{ if(Math.random()<0.5) b.score += (Math.random()*30|0); });
  if(currentTab==="classement") screenBoard();
}, 4000);

/* =====================================================
   ÉCRAN : classement
   ===================================================== */
function buildBoard(){
  // fusionne : moi + bots + joueurs en ligne (net.board)
  const rows = [];
  rows.push({ pseudo: store.pseudo || "Toi", score: store.score, me:true });
  bots.forEach(b=> rows.push({...b}));
  // joueurs en ligne reçus du serveur (autres que moi)
  net.board.forEach(p=>{
    if(p.pseudo === store.pseudo) return;
    rows.push({ pseudo:p.pseudo, score:p.score, online:true });
  });
  return rows.sort((a,b)=>b.score-a.score);
}
function screenBoard(){
  const rows = buildBoard();
  let html = `<div class="panel"><div class="eyebrow">Rang galactique</div><h2>🏆 Classement</h2>
    <p class="sub">Les pilotes ✦ sont entraînés par l'ordinateur. Les vrais joueurs connectés apparaissent en direct.</p>
    <div class="lb">`;
  rows.forEach((r,idx)=>{
    const medal = idx===0?"🥇":idx===1?"🥈":idx===2?"🥉":(idx+1);
    const tag = r.online?'<span class="tag live">en ligne</span>':r.bot?'<span class="tag bot">IA</span>':'';
    html += `<div class="lb-row ${r.me?"me-row":""}">
      <div class="rk">${medal}</div>
      <div class="nm">${r.me?"⭐ ":""}${escapeHtml(r.pseudo)} ${tag}</div>
      <div class="sc">${r.score}</div></div>`;
  });
  html += `</div></div>`;
  view.innerHTML = html;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* =====================================================
   MULTIJOUEUR (WebSocket) — leaderboard partagé + duel
   ===================================================== */
const net = {
  ws:null, board:[], duel:null, connected:false,
  connect(){
    if(!store.pseudo){ return; }
    if(SERVER_URL.includes("TON-APP")){ this.setState(false); return; } // pas encore configuré
    try{
      this.ws = new WebSocket(SERVER_URL);
    }catch(e){ this.setState(false); return; }
    this.ws.onopen = ()=>{
      this.setState(true);
      this.send({type:"hello", pseudo:store.pseudo});
      this.pushScore();
    };
    this.ws.onclose = ()=>{ this.setState(false); setTimeout(()=>this.connect(), 4000); };
    this.ws.onerror = ()=>{ this.setState(false); };
    this.ws.onmessage = ev=>{
      let m; try{m=JSON.parse(ev.data);}catch{return;}
      this.handle(m);
    };
  },
  setState(on){
    this.connected = on;
    const el=$("#netstate");
    el.className = "net " + (on?"on":"off");
    el.textContent = on ? "en ligne" : "hors ligne";
  },
  send(o){ if(this.ws && this.ws.readyState===1) this.ws.send(JSON.stringify(o)); },
  pushScore(){ this.send({type:"score", score:store.score}); },
  handle(m){
    switch(m.type){
      case "board": this.board=m.board||[]; if(currentTab==="classement") screenBoard(); break;
      case "duel_created": duelOnCreated(m); break;
      case "duel_error": toast(m.msg); break;
      case "duel_start": duelOnStart(m); break;
      case "duel_opp": duelOnOpp(m); break;
      case "duel_opp_done": duelOnOppDone(m); break;
      case "duel_left": toast("L'autre joueur a quitté le duel."); break;
    }
  }
};

/* =====================================================
   ÉCRAN : duel (lobby)
   ===================================================== */
function screenDuel(){
  if(!store.pseudo){
    view.innerHTML = `<div class="panel"><div class="eyebrow">Mode versus</div><h2>⚔️ Duel</h2>
      <p class="sub">Affronte un ami sur le même sujet, en temps réel.</p>
      <p class="hint">Écris d'abord <b>ton prénom</b> en haut de l'écran pour te connecter.</p></div>`;
    return;
  }
  if(!net.connected){
    view.innerHTML = `<div class="panel"><div class="eyebrow">Mode versus</div><h2>⚔️ Duel</h2>
      <p class="sub">Le duel en direct a besoin de la liaison au serveur.</p>
      <p class="hint">Statut : <b style="color:var(--ko)">hors ligne</b>. Vérifie que l'adresse du serveur est bien réglée
      (variable <code>SERVER_URL</code> dans le fichier) et que le serveur Render est lancé.<br><br>
      En attendant, tu peux t'entraîner dans l'onglet <b>⚡ Missions</b>.</p>
      <button class="btn ghost" id="retry">↻ Réessayer la connexion</button></div>`;
    $("#retry").onclick = ()=> net.connect();
    return;
  }
  let html = `<div class="panel"><div class="eyebrow">Mode versus</div><h2>⚔️ Duel</h2>
    <p class="sub">Même série de questions — le meilleur score l'emporte.</p>
    <div class="eyebrow" style="color:var(--or)">1 · Crée un duel</div>
    <p class="hint">Choisis un sujet, puis partage le code à ton adversaire.</p>
    <div class="grid" id="duel-themes" style="margin-top:10px">`;
  THEMES.forEach(t=> html += `<button class="ecard" data-id="${t.id}" style="--c:${t.couleur}">
    <div class="rar">${rarityStars(t)}</div><div class="em">${t.emoji}</div><div class="tt">${t.titre}</div></button>`);
  html += `</div><hr class="sep">
    <div class="eyebrow" style="color:var(--or)">2 · …ou rejoins un duel</div>
    <div class="row" style="margin-top:10px"><input id="joincode" maxlength="4" placeholder="CODE">
    <button class="btn gold" id="joinbtn">Rejoindre</button></div></div>`;
  view.innerHTML = html;
  view.querySelectorAll("#duel-themes .ecard").forEach(c=>{
    c.onclick = ()=> net.send({type:"duel_create", theme:c.dataset.id});
  });
  $("#joinbtn").onclick = ()=>{
    const code = $("#joincode").value.trim().toUpperCase();
    if(code.length<4){ toast("Entre le code à 4 lettres."); return; }
    net.send({type:"duel_join", code});
  };
}

function duelOnCreated(m){
  net.duel = { code:m.code, theme:m.theme, role:"host" };
  view.innerHTML = `<div class="panel"><div class="eyebrow">En attente d'un adversaire</div><h2>⚔️ Duel</h2>
    <p class="sub">Donne ce code à ton adversaire :</p>
    <div class="code-box">${m.code}</div>
    <p class="hint">Dès que l'autre joueur entre ce code, le duel démarre. ⏳</p>
    <button class="btn ghost" id="cancel">Annuler</button></div>`;
  $("#cancel").onclick = ()=>{ net.duel=null; render(); };
}

/* duel : jeu en cours */
let duelGame = null;
function duelOnStart(m){
  const theme = THEMES.find(t=>t.id===m.theme);
  duelGame = {
    code: net.duel ? net.duel.code : m.code,
    theme, qs: shuffle(theme.questions).slice(0, 8),
    i:0, myScore:0, oppScore:0, oppDone:false,
    myName: store.pseudo, oppName: (m.role==="host"?m.guestName:m.hostName), role:m.role
  };
  // l'hôte fixe la liste — pour que les deux aient les MÊMES questions on dérive d'une graine
  // simple : on rejoue depuis l'ordre du thème (pas mélangé) pour garantir l'égalité.
  duelGame.qs = theme.questions.slice(0, 8);
  duelShow();
}
function duelShow(){
  const g = duelGame;
  if(g.i >= g.qs.length){ duelFinishMine(); return; }
  const q = g.qs[g.i];
  const prog = Math.round(g.i/g.qs.length*100);
  let html = `<div class="panel" style="--c:${g.theme.couleur}">
    <div class="eyebrow">Duel · ${g.theme.emoji} ${g.theme.titre}</div>
    <div class="duel-grid">
      <div class="duel-col mine"><div class="nm">⭐ ${escapeHtml(g.myName)}</div><div class="sc" id="ms">${g.myScore}</div><div class="st">toi</div></div>
      <div class="vs">VS</div>
      <div class="duel-col opp"><div class="nm">${escapeHtml(g.oppName)}</div><div class="sc" id="os">${g.oppScore}</div><div class="st" id="ost">joue…</div></div>
    </div>
    <div class="path"><i style="width:${prog}%"></i></div>
    <div class="qhead"><span>Question ${g.i+1} / ${g.qs.length}</span></div>
    <div class="qtext">${q.q}</div>`;
  const isChoice = q.type==="qcm"||q.type==="vf";
  if(isChoice){
    const opts = q.type==="vf"?["Vrai","Faux"]:q.choix;
    const good = q.type==="vf"?(q.bon?0:1):q.bon;
    html += `<div class="choices">`;
    opts.forEach((o,idx)=> html+=`<button class="choice" data-i="${idx}">${o}</button>`);
    html += `</div></div>`;
    view.innerHTML = html;
    const cs = view.querySelectorAll(".choice");
    cs.forEach(b=> b.onclick=()=>{
      const ok = (+b.dataset.i)===good;
      cs.forEach((c,ci)=>{c.disabled=true; if(ci===good)c.classList.add("good"); else if(+b.dataset.i===ci)c.classList.add("bad");});
      duelAnswer(ok);
    });
  } else {
    html += `<div class="txtans"><input id="dans" autocomplete="off" placeholder="Réponse…">
      <button class="btn gold" id="dok">OK</button></div></div>`;
    view.innerHTML = html;
    const inp=$("#dans"); inp.focus();
    const ck=()=>{ if(inp.disabled)return; const ok=q.reponses.some(r=>norm(r)===norm(inp.value));
      inp.disabled=true;$("#dok").disabled=true;inp.style.borderColor=ok?"var(--ok)":"var(--ko)"; duelAnswer(ok); };
    $("#dok").onclick=ck; inp.onkeydown=e=>{if(e.key==="Enter")ck();};
  }
}
function duelAnswer(ok){
  const g=duelGame;
  if(ok) g.myScore+=10;
  $("#ms").textContent=g.myScore;
  net.send({type:"duel_progress", code:g.code, q:g.i, correct:ok, score:g.myScore});
  setTimeout(()=>{ g.i++; duelShow(); }, 700);
}
function duelOnOpp(m){
  if(!duelGame) return;
  duelGame.oppScore = m.score;
  const os=$("#os"); if(os) os.textContent=m.score;
}
function duelOnOppDone(m){
  if(!duelGame) return;
  duelGame.oppScore=m.score; duelGame.oppDone=true;
  const ost=$("#ost"); if(ost) ost.textContent="a terminé ✔";
  const os=$("#os"); if(os) os.textContent=m.score;
  // si on a déjà fini et que l'écran résultat est ouvert, on le rafraîchit
  if(duelGame._resultOpen) showDuelResult();
}
function duelFinishMine(){
  const g=duelGame;
  net.send({type:"duel_done", code:g.code, score:g.myScore});
  addScore(g.myScore); // les points du duel comptent aussi
  showDuelResult();
}
function showDuelResult(){
  const g=duelGame;
  const verdict = ()=>{
    if(!g.oppDone) return `<p class="sub">En attente de la fin de ${escapeHtml(g.oppName)}…</p>`;
    if(g.myScore>g.oppScore) return `<div class="grade">🎉 Victoire !</div>`;
    if(g.myScore<g.oppScore) return `<div class="grade">😅 ${escapeHtml(g.oppName)} l'emporte</div>`;
    return `<div class="grade">🤝 Égalité parfaite !</div>`;
  };
  view.innerHTML = `<div class="panel result" style="--c:${g.theme.couleur}">
    <div class="eyebrow">Duel terminé</div>
    <div class="duel-grid">
      <div class="duel-col mine"><div class="nm">⭐ ${escapeHtml(g.myName)}</div><div class="sc">${g.myScore}</div></div>
      <div class="vs">VS</div>
      <div class="duel-col opp"><div class="nm">${escapeHtml(g.oppName)}</div><div class="sc" id="osr">${g.oppScore}</div></div>
    </div>
    <div id="vd">${verdict()}</div>
    <button class="btn primary" id="back">⚔️ Retour au duel</button></div>`;
  $("#back").onclick = ()=>{ duelGame=null; net.duel=null; render(); };
  duelGame._resultOpen = true;
}

/* =====================================================
   PSEUDO
   ===================================================== */
const pseudoInput = $("#pseudo");
pseudoInput.value = store.pseudo;
$("#myscore").textContent = store.score;
pseudoInput.addEventListener("change", ()=>{
  store.pseudo = pseudoInput.value.trim().slice(0,16);
  save();
  if(net.connected) net.send({type:"hello", pseudo:store.pseudo});
  else net.connect();
});

/* =====================================================
   DÉMARRAGE
   ===================================================== */
render();
net.connect();

</script>

  }box.innerHTML=h;
})();
</script>
